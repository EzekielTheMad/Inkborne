<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1320" viewBox="0 0 1440 1320" role="img" aria-labelledby="title description">
  <title id="title">Inkborne field journal — visual direction reference</title>
  <desc id="description">Version 1, 22 October 2026. Editable vector reference showing serif headings, readable interface text, the light and dark brand palettes, fictional character sheet and story layout studies, and a compact mobile composition. These are visual studies, not production screens or feature commitments.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #282A25; }
    .serif { font-family: Georgia, "Times New Roman", serif; }
    .eyebrow { font-size: 11px; font-weight: 650; letter-spacing: 1.7px; }
    .small { font-size: 12px; }
    .body { font-size: 15px; }
    .muted { fill: #63675D; }
    .rule { stroke: #D4CDBF; stroke-width: 1; }
    .dark-text { fill: #EEEBDD; }
    .dark-muted { fill: #B7B9AC; }
    .dark-rule { stroke: #3B443D; stroke-width: 1; }
    .number { font-size: 26px; font-variant-numeric: tabular-nums; }
    .stat { font-size: 10px; font-weight: 600; letter-spacing: 1px; }
  </style>

