  <text x="920" y="713" class="eyebrow dark-muted">STORY</text>
  <text x="920" y="747" class="serif dark-text" font-size="27">The north road</text>
  <text x="920" y="779" class="body dark-muted">
    <tspan x="920" dy="0">Mara kept the brass compass long after its</tspan>
    <tspan x="920" dy="25">needle stopped. At the river crossing, she</tspan>
    <tspan x="920" dy="25">turned north and began a new record.</tspan>
