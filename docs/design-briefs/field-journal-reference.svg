  <text x="80" y="771" class="body">Longbow</text>
  <text x="340" y="771" class="body" text-anchor="end">+5</text>
  <text x="512" y="771" class="body" text-anchor="end">1d8 + 3</text>
  <line x1="80" y1="784" x2="512" y2="784" class="rule"/>
