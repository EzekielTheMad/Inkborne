  <text x="80" y="855" class="small muted">A working sheet, shaped by clear hierarchy.</text>

  <text x="560" y="558" class="eyebrow muted">STORY</text>
  <text x="560" y="593" class="serif" font-size="27">The north road</text>
  <text x="560" y="624" class="body muted">
    <tspan x="560" dy="0">Mara kept the brass compass</tspan>
    <tspan x="560" dy="25">long after its needle stopped.</tspan>
    <tspan x="560" dy="25">At the river crossing, she turned</tspan>
    <tspan x="560" dy="25">north and began a new record.</tspan>
  </text>
  <line x1="560" y1="729" x2="848" y2="729" class="rule"/>
  <text x="560" y="755" class="eyebrow muted">A SMALL DETAIL</text>
  <text x="560" y="784" class="serif" font-size="20">
    <tspan x="560" dy="0">A pressed fern between</tspan>
    <tspan x="560" dy="27">the last two pages.</tspan>
  </text>
  <text x="560" y="855" font-size="13" font-weight="600" fill="#3F5E50" style="fill:#3F5E50" text-decoration="underline">Read entry</text>
