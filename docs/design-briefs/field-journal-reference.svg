  <text x="56" y="211" class="serif" font-size="30">A record worth keeping.</text>
  <text x="56" y="240" class="body muted">Editorial headings. Clear controls. Room to read.</text>
  <text x="56" y="269" class="small muted">Georgia / serif display reference · system sans interface</text>
