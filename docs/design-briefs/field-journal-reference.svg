  <text x="76" y="1141" class="serif" font-size="23">The north road</text>
  <text x="76" y="1168" font-size="14" class="muted">
    <tspan x="76" dy="0">Mara kept the brass compass long</tspan>
    <tspan x="76" dy="22">after its needle stopped.</tspan>
  </text>
  <text x="76" y="1218" font-size="13" font-weight="600" fill="#3F5E50" style="fill:#3F5E50" text-decoration="underline">Read entry</text>
  <text x="76" y="1242" font-size="10" class="muted">Fictional character · layout study</text>

  <text x="416" y="1026" class="serif" font-size="29">Reflow the page.</text>
  <text x="416" y="1060" class="body muted">
    <tspan x="416" dy="0">Keep the character name, key values,</tspan>
    <tspan x="416" dy="25">and story readable at narrow widths.</tspan>
    <tspan x="416" dy="38">Tables become simple rows when needed.</tspan>
    <tspan x="416" dy="25">Give actions comfortable touch targets.</tspan>
    <tspan x="416" dy="38">This crop illustrates hierarchy;</tspan>
    <tspan x="416" dy="25">it does not define a complete screen.</tspan>
  </text>

  <text x="912" y="1026" class="serif" font-size="29">Structure carries the identity.</text>
  <text x="912" y="1060" class="body muted">
    <tspan x="912" dy="0">Use fine rules, aligned values, warm surfaces,</tspan>
    <tspan x="912" dy="25">and one restrained accent. Decoration stays</tspan>
    <tspan x="912" dy="25">secondary to a character’s information.</tspan>
  </text>
